<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F4LS3//4NDR0M3D4</title><style>*{box-sizing:border-box}body{margin:0;background:#03040a;color:#d9e7ff;font-family:monospace;min-height:100vh;overflow-x:hidden}canvas{position:fixed;inset:0;z-index:-2}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 4px);z-index:5}.wrap{max-width:850px;margin:auto;padding:28px 18px}.title{text-align:center;font-size:clamp(25px,7vw,54px);letter-spacing:4px;margin:22px 0 8px;text-shadow:0 0 15px #789}.sub{text-align:center;color:#66718a;margin-bottom:35px}.box{border:1px solid #27334d;background:rgba(5,8,18,.88);padding:24px;box-shadow:0 0 30px #000;margin-bottom:18px}.phase{color:#687894;font-size:13px}.q{font-size:20px;line-height:1.5;margin:20px 0}.hint{color:#68718a;font-size:13px}.row{display:flex;gap:10px}input{flex:1;background:#080c16;border:1px solid #34425e;color:white;padding:14px;font:inherit;outline:none}button{background:#d9e7ff;color:#05070c;border:0;padding:14px 18px;font:bold 14px monospace;cursor:pointer}.msg{min-height:22px;margin-top:14px}.bad{color:#ff6978}.good{color:#8ff0ba}.warn{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff;font-size:clamp(22px,6vw,50px);letter-spacing:3px}.glitch{animation:g .12s steps(2) infinite}@keyframes g{0%{transform:translate(2px)}50%{transform:translate(-3px,1px)}100%{transform:translate(1px,-2px)}}.tiny{font-size:11px;color:#4d5870}.pulse{animation:p 1.8s infinite}@keyframes p{50%{opacity:.45}}@media(max-width:560px){.row{flex-direction:column}.q{font-size:18px}}</style></head><body><canvas id="stars"></canvas><main class="wrap"><div id="title" class="title">F4LS3//4NDR0M3D4</div><div class="sub">TH3 SKY 1S LY1NG.</div><section class="box"><div class="phase">27 // FINAL TRANSMISSION</div><div class="q">THE ANSWERS LEFT A MESSAGE.</div><div class="q" id="letters"></div><div class="hint">THE ARCHIVE EXPECTS A QUESTION, NOT AN ANSWER.</div><div class="row"><input id="fin" autocomplete="off" spellcheck="false"><button onclick="finish()">TRANSMIT</button></div><div id="fm" class="msg"></div></section><div class="tiny">END OF LOCAL ARCHIVE // DO NOT TRUST THE INTERFACE</div></main><script>const letters=localStorage.getItem('FA4_letters')||'';document.getElementById('letters').textContent=letters+'\n\nSeparate the transmission into words.';function finish(){let a=document.getElementById('fin').value.trim().toUpperCase().replace(/[^A-Z]/g,''),m=document.getElementById('fm');if(a==='TRUSTTHEFALSECONSTELLATION'){m.className='msg good';m.innerHTML='TRANSMISSION ACCEPTED.<br><br><span class="pulse">YOU FOUND THE FALSE CONSTELLATION.</span><br><br>F4LS3//4NDR0M3D4 WAS NEVER THE SKY.<br>IT WAS THE LIE ABOUT THE SKY.<br><br>END OF ARCHIVE.'}else{m.className='msg bad';m.textContent='WRONG QUESTION. THE TRANSMISSION IS STILL LISTENING.'}}function resetHunt(){localStorage.removeItem('FA4_letters');location.href='index.html'}const c=document.getElementById('stars'),x=c.getContext('2d');function size(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',size);size();let s=Array.from({length:180},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4,a:.2+Math.random()*.8}));function draw(){x.clearRect(0,0,c.width,c.height);for(const q of s){x.globalAlpha=q.a;x.fillStyle='#fff';x.fillRect(q.x,q.y,q.r,q.r)}requestAnimationFrame(draw)}draw();setInterval(()=>{if(Math.random()<.22){title.classList.add('glitch');setTimeout(()=>title.classList.remove('glitch'),180)}},1700);</script></body></html>
